name: paper-bot-4h-dual-spot

on:
  schedule:
    - cron: "15 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bot/paper_dual_4h_bot.py"
      - "bot/paper_shadow_4h_bot.py"
      - "bot/paper_4h_bot.py"
      - "bot/write_scheduler_health.py"
      - "strategies/spot_4h_dual_trend/config.py"
      - "strategies/spot_4h_dual_trend_shadow/config.py"
      - "strategies/ma250_4h_long_flat/config.py"
      - "strategies/ma250_4h_long_short/config.py"
      - "strategies/ma250_4h_voltarget/config.py"
      - "worker/worker.js"
      - ".github/workflows/bot-4h-dual-spot.yml"

permissions:
  contents: write

concurrency:
  group: paper-bot-4h-dual-spot
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  run:
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
      BOT_NOTIFY_HEARTBEAT: ${{ vars.BOT_NOTIFY_HEARTBEAT }}
      FAPI_PROXY_URL: https://btc-trend-bot.abhishektiwari328.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run dual-trend spot paper strategy
        run: python bot/paper_dual_4h_bot.py run
      - name: Run shadow challenger paper strategy
        run: python bot/paper_shadow_4h_bot.py run
      - name: Verify production Futures relay
        run: |
          health="$(curl --fail --silent --show-error \
            https://btc-trend-bot.abhishektiwari328.workers.dev/market-data-health)"
          echo "$health" | grep -q '"market_data_backend":"bybit-linear-v3-apac-durable-object"'
      - name: Run MA250 long-flat paper strategy
        env:
          FIXED_4H_VARIANT: long_flat
        run: python bot/paper_4h_bot.py run
      - name: Run MA250 long-short paper strategy
        env:
          FIXED_4H_VARIANT: long_short
        run: python bot/paper_4h_bot.py run
      - name: Run MA250 volatility-targeted challenger
        env:
          FIXED_4H_VARIANT: voltarget
        run: python bot/paper_4h_bot.py run
      - name: Record complete-suite success
        run: python bot/write_scheduler_health.py
      - name: Commit complete 4H paper suite state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for PKG in \
            strategies/spot_4h_dual_trend/runtime \
            strategies/spot_4h_dual_trend_shadow/runtime \
            strategies/ma250_4h_long_flat/runtime \
            strategies/ma250_4h_long_short/runtime \
            strategies/ma250_4h_voltarget/runtime; do
            for f in "$PKG/state.json" "$PKG/status.json" "$PKG/trades.csv" \
              "$PKG/scheduler_health.json"; do
              [ -f "$f" ] && git add "$f"
            done
          done
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "paper-bot-4h-suite: update state [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              sleep $((i * 3))
            done
            [ "$pushed" = "1" ] || { echo "::error::state push failed"; exit 1; }
          fi
