name: paper-bot-daily

on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Send a test notification instead of running the strategy"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paper-bot-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
      BOT_NOTIFY_HEARTBEAT: ${{ vars.BOT_NOTIFY_HEARTBEAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send test notification
        if: ${{ inputs.test_notify }}
        run: python bot/notify.py
      - name: Run daily paper strategy
        if: ${{ !inputs.test_notify }}
        run: python bot/paper_bot.py run
      - name: Commit daily paper state
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PKG=strategies/daily_spot_ensemble/runtime
          for f in "$PKG/state.json" "$PKG/status.json" "$PKG/trades.csv"; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "paper-bot-daily: update state [skip ci]"
            pushed=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              echo "push attempt $i failed; retrying..."
              sleep 3
            done
            [ "$pushed" = "1" ] || { echo "::error::state push failed"; exit 1; }
          fi
