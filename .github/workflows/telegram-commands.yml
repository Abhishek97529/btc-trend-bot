name: telegram-commands

# Polls Telegram for commands you type (/portfolio, /signal, /trades, /help) and
# replies. Runs every 15 min. To reply faster, lower the cron minutes (e.g. */5)
# — but that uses more Actions minutes. To reply slower/cheaper, raise it (*/30).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-commands
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll & answer commands
        run: python bot/tg_commands.py

      - name: Commit read-offset (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/tg_offset.json
          if git diff --cached --quiet; then
            echo "No new messages — nothing to commit."
          else
            git commit -m "tg: advance read offset [skip ci]"
            # Rebase in case the daily paper-bot pushed state meanwhile, then push.
            git pull --rebase origin main
            git push
          fi
