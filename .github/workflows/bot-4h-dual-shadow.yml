name: paper-bot-4h-dual-shadow

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate without writing the paper account"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "bot/paper_shadow_4h_bot.py"
      - "strategies/spot_4h_dual_trend_shadow/config.py"
      - ".github/workflows/bot-4h-dual-shadow.yml"

permissions:
  contents: write

concurrency:
  group: paper-bot-4h-dual-shadow
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
      BOT_NOTIFY_HEARTBEAT: ${{ vars.BOT_NOTIFY_HEARTBEAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run isolated shadow dry-run
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: python bot/paper_shadow_4h_bot.py run --dry-run

      - name: Run isolated shadow paper account
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: python bot/paper_shadow_4h_bot.py run

      - name: Verify incumbent states are untouched
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          git diff --exit-code -- \
            strategies/daily_spot_ensemble/runtime \
            strategies/spot_4h_dual_trend/runtime \
            strategies/ma250_4h_long_flat/runtime \
            strategies/ma250_4h_long_short/runtime

      - name: Commit shadow paper state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PKG=strategies/spot_4h_dual_trend_shadow/runtime
          for f in "$PKG/state.json" "$PKG/status.json" "$PKG/trades.csv"; do
            [ -f "$f" ] && git add "$f"
          done
          unexpected="$(
            git diff --cached --name-only |
              grep -vE '^strategies/spot_4h_dual_trend_shadow/runtime/(state\.json|status\.json|trades\.csv)$' ||
              true
          )"
          test -z "$unexpected" || {
            echo "::error::unexpected staged path: $unexpected"
            exit 1
          }
          if git diff --cached --quiet; then
            echo "No shadow state change."
          else
            git commit -m "paper-bot-4h-dual-shadow: update state [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                pushed=1
                break
              fi
              sleep $((i * 3))
            done
            [ "$pushed" = "1" ] || {
              echo "::error::shadow state push failed"
              exit 1
            }
          fi
