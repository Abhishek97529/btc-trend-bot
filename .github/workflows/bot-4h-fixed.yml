name: paper-bots-4h-ma250

on:
  schedule:
    - cron: "10 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bot/paper_4h_bot.py"
      - "worker/worker.js"
      - "strategies/ma250_4h_long_flat/config.py"
      - "strategies/ma250_4h_long_short/config.py"
      - ".github/workflows/bot-4h-fixed.yml"

permissions:
  contents: write

concurrency:
  group: paper-bots-4h-ma250
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [long_flat, long_short]
    env:
      FIXED_4H_VARIANT: ${{ matrix.variant }}
      FAPI_PROXY_URL: https://btc-trend-bot.abhishektiwari328.workers.dev
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
      BOT_NOTIFY_HEARTBEAT: ${{ vars.BOT_NOTIFY_HEARTBEAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Wait for production Futures relay
        run: |
          for i in $(seq 1 30); do
            health="$(curl --fail --silent --show-error \
              https://btc-trend-bot.abhishektiwari328.workers.dev/market-data-health || true)"
            if echo "$health" | grep -q '"market_data_backend":"bybit-linear-v2-public-bounded"'; then
              echo "Bybit perpetual relay is ready."
              exit 0
            fi
            echo "Relay deployment not ready (attempt $i/30)."
            sleep 10
          done
          echo "::error::production Futures relay did not reach bybit-linear-v2-public-bounded"
          exit 1
      - name: Run MA250 paper strategy
        run: python bot/paper_4h_bot.py run
      - name: Commit MA250 paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$FIXED_4H_VARIANT" = "long_flat" ]; then
            PKG=strategies/ma250_4h_long_flat/runtime
          else
            PKG=strategies/ma250_4h_long_short/runtime
          fi
          for f in "$PKG/state.json" "$PKG/status.json" "$PKG/trades.csv"; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "paper-bot-ma250-${FIXED_4H_VARIANT}: update state [skip ci]"
            pushed=0
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then pushed=1; break; fi
              sleep $((i * 3))
            done
            [ "$pushed" = "1" ] || { echo "::error::state push failed"; exit 1; }
          fi
