name: paper-bots-4h-fixed

on:
  schedule:
    - cron: "10 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bots-4h-fixed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [long_flat, long_short]
    env:
      FIXED_4H_VARIANT: ${{ matrix.variant }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      BOT_WEBHOOK_URL: ${{ secrets.BOT_WEBHOOK_URL }}
      BOT_NOTIFY_HEARTBEAT: ${{ vars.BOT_NOTIFY_HEARTBEAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run fixed 4h paper bot
        run: python bot/paper_4h_bot.py run
      - name: Commit fixed 4h paper state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in bot/state_4h_${FIXED_4H_VARIANT}.json bot/status_4h_${FIXED_4H_VARIANT}.json bot/trades_4h_${FIXED_4H_VARIANT}.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "paper-bot-4h-${FIXED_4H_VARIANT}: update state [skip ci]"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              sleep $((i * 3))
            done
          fi
