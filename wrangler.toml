# Cloudflare Workers config — tells Workers Builds what to deploy on each push.
# The Worker itself is the Telegram command handler in worker/worker.js.
name = "btc-trend-bot"
main = "worker/worker.js"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "MARKET_DATA_RELAY"
class_name = "MarketDataRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MarketDataRelay"]
